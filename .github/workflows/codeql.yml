name: Code security

on:
    push:
    pull_request:
    schedule:
        - cron: '37 4 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    analyze:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
              with:
                  languages: javascript-typescript
                  build-mode: none
                  config-file: .github/codeql-config.yml
            - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
